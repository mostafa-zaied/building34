name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 09:00 UTC to prevent Supabase Free Tier 7-day pause
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://qxsctwnctwqzsdmtsssw.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_MFftSMzqB7Smzs5wjPEK8Q_9pR9VxI4}"
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            "${URL}/rest/v1/months?select=id&limit=1")
          echo "Supabase keep-alive HTTP status: ${HTTP_CODE}"
