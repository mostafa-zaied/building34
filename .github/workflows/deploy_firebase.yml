name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_and_deploy_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web for Firebase Hosting
        run: flutter build web --release --base-href "/" --pwa-strategy=none

      - name: Deploy to Firebase Hosting (mabna-care.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: mabna-care
